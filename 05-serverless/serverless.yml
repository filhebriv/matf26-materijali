service: hello-world

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: local

plugins:
  - serverless-localstack

package:
  patterns:
    - '!**'
    - ./functions/**.js

custom:
  localstack:
    stages:
      - local
    host: http://ministack
    edgePort: 4566
